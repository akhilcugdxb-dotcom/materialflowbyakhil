<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MaterialFlow">
<meta name="theme-color" content="#4F8EF7">
<title>MaterialFlow</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0F1117;--s1:#1A1D27;--s2:#22263A;--s3:#2A2E42;
  --accent:#4F8EF7;--accent2:#7C5CFC;
  --ok:#2ECC8A;--warn:#F0A429;--danger:#E24B4A;--pink:#FF6B9D;
  --t1:#F0F2FF;--t2:#9BA3C5;--t3:#5A6285;
  --bdr:rgba(255,255,255,0.07);--r:14px;--rsm:9px;--nav-h:62px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;color:var(--t1)}
#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;position:relative}
.hdr{background:var(--bg);padding:12px 16px 0;position:relative;z-index:10;flex-shrink:0}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.logo{font-size:21px;font-weight:800;letter-spacing:-0.5px}
.logo span{color:var(--accent)}
.offline-pill{display:flex;align-items:center;gap:5px;font-size:11px;background:rgba(46,204,138,.12);color:var(--ok);border-radius:20px;padding:4px 10px;border:1px solid rgba(46,204,138,.2)}
.offline-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.tabs{display:flex;gap:3px;background:var(--s1);border-radius:11px;padding:4px}
.tab{flex:1;padding:7px 2px;font-size:11px;font-weight:600;text-align:center;border-radius:8px;cursor:pointer;border:none;background:transparent;color:var(--t3);transition:all .2s}
.tab.on{background:var(--s3);color:var(--t1)}
.hdr-gap{height:12px}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 16px;padding-bottom:calc(var(--nav-h)+16px);-webkit-overflow-scrolling:touch}
.bnav{position:absolute;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--s1);border-top:1px solid var(--bdr);display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.nb{flex:1;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:500;color:var(--t3);transition:color .2s;padding:8px 0}
.nb.on{color:var(--accent)}
.nb svg{width:22px;height:22px;stroke-width:1.7}
.fab{position:absolute;bottom:calc(var(--nav-h)+14px);right:18px;width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 22px rgba(79,142,247,.45);z-index:11;transition:transform .15s}
.fab:active{transform:scale(.92)}
.fab-scan{position:absolute;bottom:calc(var(--nav-h)+76px);right:18px;width:44px;height:44px;border-radius:14px;background:var(--s3);border:1px solid var(--bdr);color:var(--t1);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.4);z-index:11;transition:transform .15s}
.fab-scan:active{transform:scale(.92)}
.card{background:var(--s1);border-radius:var(--r);border:1px solid var(--bdr);margin-bottom:10px;overflow:hidden}
.card-hdr{padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.pico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.pinfo{flex:1;min-width:0}
.pname{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{font-size:11px;color:var(--t2);margin-top:2px}
.pright{text-align:right;flex-shrink:0}
.chips{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap;margin-bottom:3px}
.chip{font-size:10px;padding:2px 7px;border-radius:5px;font-weight:700}
.chip-w{background:rgba(240,164,41,.15);color:var(--warn)}
.chip-b{background:rgba(79,142,247,.15);color:var(--accent)}
.chip-g{background:rgba(46,204,138,.13);color:var(--ok)}
.pct-lbl{font-size:11px;color:var(--t3)}
.pbar{height:3px;background:var(--s2)}
.pbar-fill{height:100%;border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.cbody{display:none;padding:0 14px 12px;animation:slidedown .2s ease}
.cbody.open{display:block}
@keyframes slidedown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.mrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--bdr)}
.mstat{width:24px;height:24px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;border:1.5px solid;transition:all .2s;font-weight:700}
.mstat.pending{background:rgba(240,164,41,.1);border-color:var(--warn);color:var(--warn)}
.mstat.delivered{background:rgba(46,204,138,.13);border-color:var(--ok);color:var(--ok)}
.mstat.requested{background:rgba(79,142,247,.13);border-color:var(--accent);color:var(--accent)}
.minfo{flex:1;min-width:0}
.mname{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mdetail{font-size:11px;color:var(--t2);margin-top:1px}
.mqty-wrap{flex-shrink:0;text-align:right;min-width:52px}
.mqty{font-size:11px;font-weight:700;color:var(--ok)}
.mqty-sub{font-size:10px;color:var(--t3)}
.mbtns{display:flex;gap:5px;flex-shrink:0}
.ibtn{width:28px;height:28px;border-radius:7px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s}
.ibtn:active{transform:scale(.9)}
.ibtn-r{background:rgba(79,142,247,.15);color:var(--accent)}
.ibtn-d{background:rgba(46,204,138,.13);color:var(--ok)}
.ibtn-x{background:rgba(226,75,74,.13);color:var(--danger)}
.add-row{display:flex;gap:6px;margin-top:10px}
.add-mat-btn{flex:1;padding:9px;border-radius:9px;background:var(--s2);border:1px dashed rgba(255,255,255,.1);color:var(--t2);font-size:12px;cursor:pointer;transition:all .2s}
.add-mat-btn:active{background:var(--s3)}
.add-scan-btn{flex:none;padding:9px 12px;border-radius:9px;background:rgba(79,142,247,.12);border:1px dashed var(--accent);color:var(--accent);font-size:12px;cursor:pointer;transition:all .2s}
.slbl{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:1.2px;margin:14px 0 8px}
.search{background:var(--s1);border:1px solid var(--bdr);border-radius:11px;padding:10px 14px;color:var(--t1);font-size:14px;outline:none;width:100%;margin-bottom:12px}
.search::placeholder{color:var(--t3)}
.search:focus{border-color:var(--accent)}
.fbadges{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.fbadge{font-size:12px;padding:5px 13px;border-radius:20px;border:1px solid var(--bdr);background:transparent;color:var(--t2);cursor:pointer;transition:all .15s;font-weight:500}
.fbadge.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* TOTALS TABLE */
.dtable{width:100%;border-collapse:collapse;margin:6px 0 4px;font-size:12px}
.dtable th{color:var(--t3);font-weight:600;text-align:left;padding:5px 6px;border-bottom:1px solid var(--bdr);font-size:10px;text-transform:uppercase;letter-spacing:.6px}
.dtable td{padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle;cursor:pointer}
.dtable tr:hover td{background:rgba(255,255,255,.02)}
.dtable tr:last-child td{border-bottom:none}
.dmat-name{font-weight:600;color:var(--t1);font-size:12px}
.dmat-spec{font-size:10px;color:var(--t3);margin-top:2px}
.qty-del{color:var(--ok);font-weight:700}
.qty-ord{color:var(--t2)}
.qbar-wrap{width:48px;height:5px;background:var(--s2);border-radius:3px;overflow:hidden;margin-top:3px}
.qbar-fill{height:100%;border-radius:3px;transition:width .4s}
.dtable tfoot td{font-weight:700;padding:8px 6px;border-top:1px solid var(--bdr);font-size:11px}
/* DASHBOARD */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.scard{background:var(--s1);border-radius:var(--r);border:1px solid var(--bdr);padding:14px}
.sval{font-size:28px;font-weight:800;line-height:1}
.slbl2{font-size:12px;color:var(--t2);margin-top:4px}
.bigbar{background:var(--s2);border-radius:5px;height:8px;overflow:hidden;margin:6px 0}
.bigbar-fill{height:100%;border-radius:5px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.actrow{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--bdr)}
.actdot{width:10px;height:10px;border-radius:50%;margin-top:3px;flex-shrink:0}
.acttxt{font-size:13px;line-height:1.4}
.acttime{font-size:11px;color:var(--t3);margin-top:2px}
/* MODAL */
.moverlay{position:absolute;inset:0;background:rgba(0,0,0,.75);z-index:50;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s}
.moverlay.open{opacity:1;pointer-events:all}
.mdrawer{background:var(--s1);border-radius:20px 20px 0 0;width:100%;padding:16px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.34,1.2,.64,1);max-height:92vh;overflow-y:auto}
.moverlay.open .mdrawer{transform:translateY(0)}
.mhandle{width:36px;height:4px;background:var(--s3);border-radius:2px;margin:0 auto 16px}
.mtitle{font-size:18px;font-weight:800;margin-bottom:16px}
.fg{margin-bottom:13px}
.flbl{font-size:12px;color:var(--t2);margin-bottom:6px;font-weight:600}
.finput{width:100%;background:var(--s2);border:1px solid var(--bdr);border-radius:var(--rsm);padding:11px 13px;color:var(--t1);font-size:14px;outline:none;-webkit-appearance:none}
.finput:focus{border-color:var(--accent)}
.finput option{background:var(--s2)}
.btn-ok{width:100%;padding:14px;border-radius:var(--rsm);background:var(--accent);color:#fff;font-size:15px;font-weight:700;border:none;cursor:pointer;margin-top:6px;transition:opacity .2s}
.btn-ok:active{opacity:.8}
.btn-ok2{background:var(--s3);color:var(--t1);border:1px solid var(--bdr)}
.btn-danger{background:var(--danger)}
/* SCAN */
.scan-zone{border:2px dashed var(--accent);border-radius:var(--r);min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;padding:20px;margin-bottom:14px;background:rgba(79,142,247,.04);transition:background .2s}
.scan-zone:active{background:rgba(79,142,247,.1)}
.scan-zone img{max-width:100%;max-height:200px;border-radius:8px;object-fit:contain}
.ocr-progress{background:var(--s2);border-radius:var(--rsm);padding:12px;margin-bottom:12px;font-size:13px;color:var(--t2)}
.ocr-bar{height:4px;background:var(--s3);border-radius:2px;margin-top:8px;overflow:hidden}
.ocr-bar-fill{height:100%;border-radius:2px;background:var(--accent);transition:width .3s}
.ocr-raw{background:var(--s2);border-radius:var(--rsm);padding:12px;margin-bottom:12px;font-size:11px;color:var(--t3);line-height:1.6;max-height:100px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
/* DELIVERY LOG */
.dlog-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--bdr);font-size:12px}
.dlog-qty{font-weight:700;color:var(--ok);min-width:60px}
.dlog-date{color:var(--t3);font-size:11px;flex-shrink:0}
.dlog-note{color:var(--t2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* TOAST */
.toast{position:absolute;bottom:calc(var(--nav-h)+72px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--s3);color:var(--t1);padding:10px 20px;border-radius:30px;font-size:13px;font-weight:500;white-space:nowrap;opacity:0;transition:all .3s;z-index:99;pointer-events:none;border:1px solid var(--bdr)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:48px 20px;color:var(--t3)}
.empty-ico{font-size:44px;margin-bottom:12px}
.empty-txt{font-size:14px}
::-webkit-scrollbar{width:0}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="hdr-top">
      <div class="logo">Material<span>Flow</span></div>
      <div class="offline-pill"><div class="offline-dot"></div>Offline</div>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab on"  onclick="go('projects')">Projects</button>
      <button class="tab"     onclick="go('requests')">Requests</button>
      <button class="tab"     onclick="go('totals')">Totals</button>
      <button class="tab"     onclick="go('dashboard')">Dashboard</button>
    </div>
    <div class="hdr-gap"></div>
  </div>

  <div class="content" id="content"></div>

  <button class="fab-scan" onclick="openScanModal()" title="📷 Scan hard-copy request form">📷</button>
  <button class="fab" onclick="fabClick()">+</button>

  <nav class="bnav">
    <button class="nb on" onclick="go('projects')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>Projects
    </button>
    <button class="nb" onclick="go('requests')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Requests
    </button>
    <button class="nb" onclick="go('totals')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>Totals
    </button>
    <button class="nb" onclick="go('settings')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings
    </button>
  </nav>

  <div class="moverlay" id="overlay" onclick="closeBg(event)">
    <div class="mdrawer" id="drawer">
      <div class="mhandle"></div>
      <div id="drawerBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <input type="file" id="scanInput" accept="image/*" capture="environment" style="display:none" onchange="handleScanFile(event)">
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────
let DB={projects:[],materials:[],log:[]};
// material: {id,projId,name,qty(number),qtyUnit,spec,date,status,note,deliveries:[{id,qty,date,note}]}
let view='projects',openCards={},openTotals={},filterStatus='all',searchQ='';
const ICONS=['🏗️','🏡','🏢','🏭','🏬','🏛️','🏨','🏪','🏫','🏦'];
const COLORS=['#4F8EF7','#7C5CFC','#2ECC8A','#F0A429','#E24B4A','#FF6B9D','#22D3EE','#F97316'];
const UNITS=['m³','tonnes','kg','pcs','m²','lm','sheets','units','bags','sets','rolls','trips'];

// ── PERSIST ───────────────────────────────────────────────────
function save(){try{localStorage.setItem('mf_v2',JSON.stringify(DB));}catch(e){}}
function load(){
  try{
    const raw=localStorage.getItem('mf_v2')||localStorage.getItem('mf_db2')||localStorage.getItem('mf_db');
    if(raw){
      DB=JSON.parse(raw);
      DB.materials.forEach(m=>{
        if(!m.deliveries)m.deliveries=[];
        if(!m.qtyUnit)m.qtyUnit='pcs';
        if(typeof m.qty==='string'){const x=m.qty.match(/([\d.]+)\s*(.*)/);m.qty=x?parseFloat(x[1]):0;if(x&&x[2])m.qtyUnit=x[2].trim();}
        if(m.status==='delivered'&&!m.deliveries.length)m.deliveries.push({id:Date.now()+Math.random(),qty:m.qty,date:m.date,note:'Migrated'});
      });
      save();return;
    }
  }catch(e){}
  seed();
}
function seed(){
  DB.projects=[
    {id:1,name:'Tower Block A',icon:'🏗️',color:'#4F8EF7',client:'AlDar Properties',site:'Dubai Marina',created:Date.now()},
    {id:2,name:'Villa Complex',icon:'🏡',color:'#7C5CFC',client:'DAMAC Holdings',site:'Arabian Ranches',created:Date.now()},
    {id:3,name:'Office Fitout',icon:'🏢',color:'#2ECC8A',client:'Emaar Dev.',site:'Downtown Dubai',created:Date.now()},
  ];
  DB.materials=[
    {id:1,projId:1,name:'Ready Mix Concrete C35',qty:120,qtyUnit:'m³',spec:'C35 grade',status:'delivered',date:'2025-05-08',note:'',deliveries:[{id:11,qty:60,date:'2025-05-06',note:'First pour'},{id:12,qty:60,date:'2025-05-08',note:'Second pour'}]},
    {id:2,projId:1,name:'Steel Rebar 16mm',qty:8.5,qtyUnit:'tonnes',spec:'Grade 60',status:'pending',date:'2025-05-10',note:'',deliveries:[]},
    {id:3,projId:1,name:'Scaffolding Pipes',qty:200,qtyUnit:'pcs',spec:'6m length',status:'requested',date:'2025-05-09',note:'',deliveries:[]},
    {id:4,projId:1,name:'Waterproofing Membrane',qty:500,qtyUnit:'m²',spec:'Type 2',status:'pending',date:'2025-05-11',note:'',deliveries:[]},
    {id:5,projId:2,name:'AAC Blocks 200mm',qty:2400,qtyUnit:'units',spec:'200x200x600',status:'delivered',date:'2025-05-07',note:'',deliveries:[{id:21,qty:1200,date:'2025-05-05',note:'Batch 1'},{id:22,qty:1200,date:'2025-05-07',note:'Batch 2'}]},
    {id:6,projId:2,name:'Window Frames UPVC',qty:42,qtyUnit:'units',spec:'1.2x1.5m',status:'requested',date:'2025-05-10',note:'',deliveries:[{id:23,qty:20,date:'2025-05-09',note:'Partial'}]},
    {id:7,projId:2,name:'Ceramic Tiles 60x60',qty:800,qtyUnit:'m²',spec:'Beige matte',status:'pending',date:'2025-05-11',note:'',deliveries:[]},
    {id:8,projId:3,name:'Gypsum Board 12mm',qty:1200,qtyUnit:'sheets',spec:'Standard',status:'delivered',date:'2025-05-06',note:'',deliveries:[{id:31,qty:600,date:'2025-05-04',note:'Floors 1-5'},{id:32,qty:600,date:'2025-05-06',note:'Floors 6-10'}]},
    {id:9,projId:3,name:'LED Ceiling Panels',qty:180,qtyUnit:'units',spec:'60x60cm',status:'pending',date:'2025-05-11',note:'',deliveries:[]},
    {id:10,projId:3,name:'Raised Floor System',qty:450,qtyUnit:'m²',spec:'Steel panel',status:'requested',date:'2025-05-08',note:'',deliveries:[{id:33,qty:150,date:'2025-05-08',note:'Zone A'}]},
  ];
  DB.log=[
    {text:'Concrete C35 (120 m³) delivered – Tower Block A',time:'2 hrs ago',color:'#2ECC8A'},
    {text:'Window Frames requested – Villa Complex',time:'5 hrs ago',color:'#4F8EF7'},
    {text:'AAC Blocks (2400 units) delivered – Villa Complex',time:'Yesterday',color:'#2ECC8A'},
    {text:'Gypsum Board (1200 sheets) delivered – Office Fitout',time:'2 days ago',color:'#2ECC8A'},
  ];
  save();
}

// ── HELPERS ───────────────────────────────────────────────────
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function val(id){const e=document.getElementById(id);return e?e.value.trim():'';}
function cap(s){return s?s[0].toUpperCase()+s.slice(1):'';}
function today(){return new Date().toISOString().slice(0,10);}
function totDel(m){return(m.deliveries||[]).reduce((s,d)=>s+parseFloat(d.qty||0),0);}
function pct(m){return m.qty>0?Math.min(100,Math.round(totDel(m)/m.qty*100)):0;}
let ttimer;
function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');clearTimeout(ttimer);ttimer=setTimeout(()=>e.classList.remove('show'),2400);}

// ── NAV ───────────────────────────────────────────────────────
function go(v){
  view=v;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on',['projects','requests','totals','dashboard'][i]===v));
  document.querySelectorAll('.nb').forEach((b,i)=>b.classList.toggle('on',['projects','requests','totals','settings'][i]===v));
  if(v==='settings'){openSettings();return;}
  render();
}
function render(){
  const c=document.getElementById('content');
  if(view==='projects')c.innerHTML=rProjects();
  else if(view==='requests')c.innerHTML=rRequests();
  else if(view==='totals')c.innerHTML=rTotals();
  else if(view==='dashboard')c.innerHTML=rDashboard();
}

// ── PROJECTS ──────────────────────────────────────────────────
function rProjects(){
  let h=`<input class="search" placeholder="🔍  Search materials..." oninput="searchQ=this.value;render()" value="${esc(searchQ)}">`;
  if(!DB.projects.length)return h+`<div class="empty"><div class="empty-ico">📁</div><div class="empty-txt">No projects yet.<br>Tap + to create your first project.</div></div>`;
  DB.projects.forEach(p=>{
    const mats=DB.materials.filter(m=>m.projId===p.id&&(!searchQ||m.name.toLowerCase().includes(searchQ.toLowerCase())));
    if(searchQ&&!mats.length)return;
    const del=mats.filter(m=>m.status==='delivered').length;
    const pend=mats.filter(m=>m.status==='pending').length;
    const req=mats.filter(m=>m.status==='requested').length;
    const pp=mats.length?Math.round(del/mats.length*100):0;
    const isOpen=openCards[p.id];
    h+=`<div class="card">
      <div class="card-hdr" onclick="toggleCard(${p.id})">
        <div class="pico" style="background:${p.color}22">${p.icon}</div>
        <div class="pinfo"><div class="pname">${esc(p.name)}</div><div class="pmeta">${esc(p.client)} · ${esc(p.site)}</div></div>
        <div class="pright">
          <div class="chips">
            ${pend?`<div class="chip chip-w">${pend} pend</div>`:''}
            ${req?`<div class="chip chip-b">${req} req</div>`:''}
            ${del?`<div class="chip chip-g">${del} done</div>`:''}
          </div>
          <div class="pct-lbl">${pp}% complete</div>
        </div>
      </div>
      <div class="pbar"><div class="pbar-fill" style="width:${pp}%;background:${p.color}"></div></div>
      <div class="cbody ${isOpen?'open':''}">`;
    if(!mats.length){
      h+=`<div style="padding:12px 0;color:var(--t3);font-size:13px;text-align:center">No materials yet.</div>`;
    }else{
      mats.forEach(m=>{
        const ico={delivered:'✓',pending:'⏳',requested:'→'}[m.status];
        const td=totDel(m);
        h+=`<div class="mrow">
          <div class="mstat ${m.status}" onclick="cycleStatus(${m.id})">${ico}</div>
          <div class="minfo"><div class="mname">${esc(m.name)}</div><div class="mdetail">${esc(m.spec)} · ${m.date}</div></div>
          <div class="mqty-wrap"><div class="mqty">${td}/${m.qty}</div><div class="mqty-sub">${esc(m.qtyUnit)}</div></div>
          <div class="mbtns">
            <button class="ibtn ibtn-d" onclick="openLogDelivery(${m.id})" title="Log Delivery">📦</button>
            ${m.status!=='requested'?`<button class="ibtn ibtn-r" onclick="setStatus(${m.id},'requested')" title="Request">📋</button>`:''}
            <button class="ibtn ibtn-x" onclick="delMaterial(${m.id})" title="Delete">✕</button>
          </div>
        </div>`;
      });
    }
    h+=`<div class="add-row">
      <button class="add-mat-btn" onclick="openAddMaterial(${p.id})">＋ Add Material</button>
      <button class="add-scan-btn" onclick="openScanForProject(${p.id})" title="Scan hard-copy form">📷 Scan</button>
    </div></div></div>`;
  });
  return h;
}

// ── REQUESTS ──────────────────────────────────────────────────
function rRequests(){
  let h=`<div class="fbadges">${['all','pending','requested','delivered'].map(s=>`<button class="fbadge ${filterStatus===s?'on':''}" onclick="filterStatus='${s}';render()">${s==='all'?'All':cap(s)}</button>`).join('')}</div>`;
  const all=DB.materials.filter(m=>filterStatus==='all'||m.status===filterStatus);
  if(!all.length)return h+`<div class="empty"><div class="empty-ico">📋</div><div class="empty-txt">No items found.</div></div>`;
  const grp={};
  all.forEach(m=>{const p=DB.projects.find(p=>p.id===m.projId);const k=p?p.id:0;if(!grp[k])grp[k]={proj:p,items:[]};grp[k].items.push(m);});
  Object.values(grp).forEach(g=>{
    const p=g.proj;
    h+=`<div class="slbl">${p?p.icon:'📦'} ${p?esc(p.name):'Unknown'}</div>`;
    g.items.forEach(m=>{
      const sc={pending:'var(--warn)',requested:'var(--accent)',delivered:'var(--ok)'}[m.status];
      const ico={delivered:'✓',pending:'⏳',requested:'→'}[m.status];
      const td=totDel(m);const pp=pct(m);
      h+=`<div class="card" style="margin-bottom:8px">
        <div class="card-hdr" style="cursor:default">
          <div class="mstat ${m.status}" onclick="cycleStatus(${m.id})">${ico}</div>
          <div class="minfo"><div class="mname">${esc(m.name)}</div><div class="mdetail">${td}/${m.qty} ${esc(m.qtyUnit)} · ${esc(m.spec)}</div></div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
            <div style="font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:${sc}20;color:${sc}">${cap(m.status)}</div>
            <button class="ibtn ibtn-d" onclick="openLogDelivery(${m.id})" style="width:auto;padding:3px 10px;font-size:11px;border-radius:6px">📦 Log</button>
          </div>
        </div>
        ${pp>0?`<div class="pbar" style="margin:0 14px 10px"><div class="pbar-fill" style="width:${pp}%;background:var(--ok)"></div></div>`:''}
      </div>`;
    });
  });
  return h;
}

// ── TOTALS (NEW) ──────────────────────────────────────────────
function rTotals(){
  if(!DB.projects.length)return`<div class="empty"><div class="empty-ico">📊</div><div class="empty-txt">No projects yet.</div></div>`;
  let h='';
  DB.projects.forEach(p=>{
    const mats=DB.materials.filter(m=>m.projId===p.id);
    if(!mats.length)return;
    const isOpen=openTotals[p.id]!==false;
    h+=`<div class="card">
      <div class="card-hdr" onclick="openTotals[${p.id}]=!openTotals[${p.id}];render()">
        <div class="pico" style="background:${p.color}22">${p.icon}</div>
        <div class="pinfo"><div class="pname">${esc(p.name)}</div><div class="pmeta">${esc(p.client)} · ${mats.length} materials</div></div>
        <div style="color:var(--t3);font-size:18px">${isOpen?'▾':'▸'}</div>
      </div>
      <div class="cbody ${isOpen?'open':''}">
        <table class="dtable">
          <thead><tr>
            <th style="width:36%">Material</th>
            <th>Ordered</th>
            <th>Delivered</th>
            <th>Progress</th>
          </tr></thead><tbody>`;
    mats.forEach(m=>{
      const td=totDel(m);const pp=pct(m);
      const bc=pp>=100?'var(--ok)':pp>50?'var(--accent)':'var(--warn)';
      h+=`<tr onclick="openDeliveryLog(${m.id})">
        <td><div class="dmat-name">${esc(m.name)}</div><div class="dmat-spec">${esc(m.spec)}</div></td>
        <td class="qty-ord">${m.qty}<br><span style="font-size:10px;color:var(--t3)">${esc(m.qtyUnit)}</span></td>
        <td class="qty-del">${td}<br><span style="font-size:10px;color:var(--t3)">${esc(m.qtyUnit)}</span></td>
        <td>
          <div style="font-size:12px;font-weight:700;color:${bc}">${pp}%</div>
          <div class="qbar-wrap"><div class="qbar-fill" style="width:${pp}%;background:${bc}"></div></div>
        </td>
      </tr>`;
    });
    // summary footer
    const totalDel=mats.reduce((s,m)=>s+totDel(m),0);
    const avgPct=mats.length?Math.round(mats.reduce((s,m)=>s+pct(m),0)/mats.length):0;
    h+=`</tbody><tfoot><tr>
      <td style="color:var(--t2)">${mats.length} lines</td>
      <td style="color:var(--t2)">—</td>
      <td style="color:var(--ok)">${Math.round(totalDel*100)/100}</td>
      <td style="color:var(--t2)">${avgPct}% avg</td>
    </tr></tfoot></table>
    <div style="font-size:11px;color:var(--t3);text-align:center;padding:4px 0 2px">Tap any row for delivery log</div>
    </div></div>`;
  });
  return h;
}

// ── DASHBOARD ─────────────────────────────────────────────────
function rDashboard(){
  const total=DB.materials.length;
  const del=DB.materials.filter(m=>m.status==='delivered').length;
  const pend=DB.materials.filter(m=>m.status==='pending').length;
  const req=DB.materials.filter(m=>m.status==='requested').length;
  const pp=total?Math.round(del/total*100):0;
  let h=`<div class="slbl">Overview</div>
  <div class="sgrid">
    <div class="scard"><div class="sval" style="color:var(--accent)">${DB.projects.length}</div><div class="slbl2">Projects</div></div>
    <div class="scard"><div class="sval" style="color:var(--t1)">${total}</div><div class="slbl2">Materials</div></div>
    <div class="scard"><div class="sval" style="color:var(--ok)">${del}</div><div class="slbl2">Fully Delivered</div></div>
    <div class="scard"><div class="sval" style="color:var(--warn)">${pend}</div><div class="slbl2">Pending</div></div>
  </div>
  <div class="card" style="padding:14px;margin-bottom:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <span style="font-size:13px;color:var(--t2)">Overall Delivery</span>
      <span style="font-size:14px;font-weight:800;color:var(--ok)">${pp}%</span>
    </div>
    <div class="bigbar"><div class="bigbar-fill" style="width:${pp}%;background:linear-gradient(90deg,var(--ok),var(--accent))"></div></div>
    <div style="display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:var(--t3)">
      <span>✓ ${del} delivered</span><span>→ ${req} requested</span><span>⏳ ${pend} pending</span>
    </div>
  </div>
  <div class="slbl">Per Project</div>`;
  DB.projects.forEach(p=>{
    const mats=DB.materials.filter(m=>m.projId===p.id);
    const pdel=mats.filter(m=>m.status==='delivered').length;
    const ppct=mats.length?Math.round(pdel/mats.length*100):0;
    const totalQty=mats.reduce((s,m)=>s+totDel(m),0);
    h+=`<div class="card" style="padding:12px 14px;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:7px">
        <span style="font-size:20px">${p.icon}</span>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:700">${esc(p.name)}</div>
          <div style="font-size:11px;color:var(--t3)">${esc(p.client)} · ${Math.round(totalQty*10)/10} units delivered total</div>
        </div>
        <span style="font-size:14px;font-weight:800;color:${p.color}">${ppct}%</span>
      </div>
      <div class="pbar" style="height:5px;border-radius:3px"><div class="pbar-fill" style="width:${ppct}%;background:${p.color}"></div></div>
      <div style="font-size:11px;color:var(--t3);margin-top:5px">${pdel} of ${mats.length} material lines complete</div>
    </div>`;
  });
  if(DB.log.length){
    h+=`<div class="slbl" style="margin-top:16px">Recent Activity</div>`;
    DB.log.slice(0,12).forEach(l=>{h+=`<div class="actrow"><div class="actdot" style="background:${l.color}"></div><div><div class="acttxt">${esc(l.text)}</div><div class="acttime">${l.time}</div></div></div>`;});
  }
  return h;
}

// ── ACTIONS ───────────────────────────────────────────────────
function toggleCard(id){openCards[id]=!openCards[id];render();}
function cycleStatus(id){
  const m=DB.materials.find(m=>m.id===id);if(!m)return;
  const next={pending:'requested',requested:'delivered',delivered:'pending'};
  addLog(m,next[m.status]);m.status=next[m.status];
  save();render();toast(cap(m.status)+' ✓');
}
function setStatus(id,status){
  const m=DB.materials.find(m=>m.id===id);if(!m)return;
  addLog(m,status);m.status=status;save();render();toast(cap(status)+' ✓');
}
function delMaterial(id){
  const m=DB.materials.find(m=>m.id===id);if(!m)return;
  if(!confirm(`Delete "${m.name}"?`))return;
  DB.materials=DB.materials.filter(m=>m.id!==id);save();render();toast('Deleted');
}
function addLog(m,status){
  const p=DB.projects.find(p=>p.id===m.projId);
  const c={delivered:'#2ECC8A',requested:'#4F8EF7',pending:'#F0A429'}[status];
  const v={delivered:'delivered –',requested:'requested –',pending:'set pending –'}[status];
  DB.log.unshift({text:`${m.name} ${v} ${p?p.name:''}`,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),color:c});
  if(DB.log.length>30)DB.log.pop();
}

// ── LOG DELIVERY ──────────────────────────────────────────────
function openLogDelivery(matId){
  const m=DB.materials.find(m=>m.id===matId);if(!m)return;
  const td=totDel(m);const rem=Math.max(0,m.qty-td);
  openDrawer(`
    <div class="mtitle">📦 Log Delivery</div>
    <div style="background:var(--s2);border-radius:var(--rsm);padding:12px;margin-bottom:14px">
      <div style="font-size:14px;font-weight:700;margin-bottom:6px">${esc(m.name)}</div>
      <div style="display:flex;justify-content:space-between;font-size:12px">
        <span style="color:var(--t2)">Ordered: <b style="color:var(--t1)">${m.qty} ${esc(m.qtyUnit)}</b></span>
        <span style="color:var(--t2)">Done: <b style="color:var(--ok)">${td}</b></span>
        <span style="color:var(--t2)">Left: <b style="color:var(--warn)">${rem}</b></span>
      </div>
      <div class="pbar" style="height:5px;border-radius:3px;margin-top:8px"><div class="pbar-fill" style="width:${pct(m)}%;background:var(--ok)"></div></div>
    </div>
    <div class="fg"><div class="flbl">Quantity Delivered *</div>
      <div style="display:flex;gap:8px">
        <input class="finput" id="dQty" type="number" min="0.01" step="any" placeholder="${rem||'0'}" value="${rem||''}" style="flex:1">
        <div style="padding:11px 13px;background:var(--s3);border-radius:var(--rsm);color:var(--t2);font-size:13px;white-space:nowrap">${esc(m.qtyUnit)}</div>
      </div>
    </div>
    <div class="fg"><div class="flbl">Delivery Date</div><input class="finput" id="dDate" type="date" value="${today()}"></div>
    <div class="fg"><div class="flbl">Batch / DO Reference</div><input class="finput" id="dNote" placeholder="e.g. DO#12345, Batch 2, Zone B"></div>
    <button class="btn-ok" onclick="saveDelivery(${matId})">Save Delivery</button>
    ${m.deliveries&&m.deliveries.length?`
      <div class="slbl" style="margin-top:14px">Delivery History (${m.deliveries.length})</div>
      ${m.deliveries.slice().reverse().map(d=>`<div class="dlog-row"><span class="dlog-qty">+${d.qty} ${esc(m.qtyUnit)}</span><span class="dlog-note">${esc(d.note||'—')}</span><span class="dlog-date">${d.date}</span></div>`).join('')}
    `:''}
  `);
}
function saveDelivery(matId){
  const m=DB.materials.find(m=>m.id===matId);if(!m)return;
  const qty=parseFloat(val('dQty'));
  if(!qty||qty<=0){alert('Enter a valid quantity.');return;}
  m.deliveries.push({id:Date.now(),qty,date:val('dDate')||today(),note:val('dNote')});
  const td=totDel(m);
  if(td>=m.qty)m.status='delivered';
  else if(td>0)m.status='requested';
  addLog(m,'delivered');
  save();closeDrawer();render();
  toast(`+${qty} ${m.qtyUnit} logged ✓`);
}

// ── DELIVERY LOG POPUP (from Totals) ─────────────────────────
function openDeliveryLog(matId){
  const m=DB.materials.find(m=>m.id===matId);if(!m)return;
  const td=totDel(m);const pp=pct(m);
  openDrawer(`
    <div class="mtitle">${esc(m.name)}</div>
    <div style="background:var(--s2);border-radius:var(--rsm);padding:14px;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="color:var(--t2);font-size:12px">Ordered</span><span style="font-weight:700">${m.qty} ${esc(m.qtyUnit)}</span></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="color:var(--t2);font-size:12px">Total Delivered</span><span style="font-weight:700;color:var(--ok)">${td} ${esc(m.qtyUnit)}</span></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:10px"><span style="color:var(--t2);font-size:12px">Remaining</span><span style="font-weight:700;color:var(--warn)">${Math.max(0,m.qty-td)} ${esc(m.qtyUnit)}</span></div>
      <div class="pbar" style="height:7px;border-radius:4px"><div class="pbar-fill" style="width:${pp}%;background:var(--ok)"></div></div>
      <div style="font-size:11px;color:var(--t3);text-align:right;margin-top:4px">${pp}% complete · ${m.deliveries.length} deliveries</div>
    </div>
    ${m.deliveries.length?`
      <div class="slbl">All Deliveries</div>
      ${m.deliveries.slice().reverse().map((d,i)=>`<div class="dlog-row">
        <span style="font-size:11px;color:var(--t3);min-width:24px">#${m.deliveries.length-i}</span>
        <span class="dlog-qty">+${d.qty} ${esc(m.qtyUnit)}</span>
        <span class="dlog-note">${esc(d.note||'—')}</span>
        <span class="dlog-date">${d.date}</span>
      </div>`).join('')}
    `:`<div style="color:var(--t3);font-size:13px;text-align:center;padding:20px 0">No deliveries logged yet.</div>`}
    <button class="btn-ok" style="margin-top:14px" onclick="closeDrawer();openLogDelivery(${matId})">＋ Log New Delivery</button>
  `);
}

// ── MODALS ────────────────────────────────────────────────────
function openDrawer(html){document.getElementById('drawerBody').innerHTML=html;document.getElementById('overlay').classList.add('open');}
function closeDrawer(){document.getElementById('overlay').classList.remove('open');}
function closeBg(e){if(e.target===document.getElementById('overlay'))closeDrawer();}
function fabClick(){if(view==='projects')openAddProject();else openAddMaterialGeneral();}

let selIcon=ICONS[0];
function openAddProject(){
  openDrawer(`
    <div class="mtitle">New Project</div>
    <div class="fg"><div class="flbl">Project Name *</div><input class="finput" id="pName" placeholder="e.g. Residential Tower B" autofocus></div>
    <div class="fg"><div class="flbl">Client / Owner</div><input class="finput" id="pClient" placeholder="Client name"></div>
    <div class="fg"><div class="flbl">Site Location</div><input class="finput" id="pSite" placeholder="e.g. Dubai Marina"></div>
    <div class="fg"><div class="flbl">Icon</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px" id="iconPicker">
        ${ICONS.map((ic,i)=>`<div onclick="selIcon='${ic}';document.querySelectorAll('#iconPicker>div').forEach(d=>d.style.borderColor=d.dataset.icon==='${ic}'?'var(--accent)':'var(--bdr)')" style="width:40px;height:40px;border-radius:10px;border:2px solid ${i===0?'var(--accent)':'var(--bdr)'};display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer" data-icon="${ic}">${ic}</div>`).join('')}
      </div>
    </div>
    <button class="btn-ok" onclick="saveProject()">Create Project</button>
  `);
}
function saveProject(){
  const name=val('pName'),client=val('pClient'),site=val('pSite');
  if(!name){alert('Project name is required.');return;}
  DB.projects.push({id:Date.now(),name,client:client||'—',site:site||'—',icon:selIcon,color:COLORS[DB.projects.length%COLORS.length],created:Date.now()});
  selIcon=ICONS[0];save();closeDrawer();render();toast('Project created!');
}
function unitOpts(sel){return UNITS.map(u=>`<option value="${u}"${u===sel?' selected':''}>${u}</option>`).join('');}
function openAddMaterial(projId,pre={}){
  openDrawer(`
    <div class="mtitle">Add Material</div>
    <div class="fg"><div class="flbl">Material Name *</div><input class="finput" id="mName" placeholder="e.g. Ready Mix Concrete C30" value="${esc(pre.name||'')}"></div>
    <div style="display:flex;gap:8px" class="fg">
      <div style="flex:1"><div class="flbl">Qty Ordered</div><input class="finput" id="mQty" type="number" min="0" step="any" placeholder="0" value="${pre.qty||''}"></div>
      <div style="flex:1"><div class="flbl">Unit</div><select class="finput" id="mQtyUnit">${unitOpts(pre.qtyUnit||'pcs')}</select></div>
    </div>
    <div class="fg"><div class="flbl">Specification / Grade</div><input class="finput" id="mSpec" placeholder="e.g. C35, Grade 60" value="${esc(pre.spec||'')}"></div>
    <div class="fg"><div class="flbl">Required By</div><input class="finput" id="mDate" type="date" value="${pre.date||today()}"></div>
    <div class="fg"><div class="flbl">Status</div>
      <select class="finput" id="mStatus">
        <option value="pending">⏳ Pending</option>
        <option value="requested"${pre.status==='requested'?' selected':''}>→ Requested</option>
        <option value="delivered">✓ Delivered</option>
      </select>
    </div>
    <button class="btn-ok" onclick="saveMaterial(${projId})">Add Material</button>
  `);
}
function openAddMaterialGeneral(){
  if(!DB.projects.length){openAddProject();return;}
  const opts=DB.projects.map(p=>`<option value="${p.id}">${p.icon} ${p.name}</option>`).join('');
  openDrawer(`
    <div class="mtitle">Add Material</div>
    <div class="fg"><div class="flbl">Project *</div><select class="finput" id="mProj">${opts}</select></div>
    <div class="fg"><div class="flbl">Material Name *</div><input class="finput" id="mName" placeholder="e.g. Steel Rebar 12mm" autofocus></div>
    <div style="display:flex;gap:8px" class="fg">
      <div style="flex:1"><div class="flbl">Qty Ordered</div><input class="finput" id="mQty" type="number" min="0" step="any" placeholder="0"></div>
      <div style="flex:1"><div class="flbl">Unit</div><select class="finput" id="mQtyUnit">${unitOpts('pcs')}</select></div>
    </div>
    <div class="fg"><div class="flbl">Specification / Grade</div><input class="finput" id="mSpec" placeholder="e.g. Grade 60, 200mm"></div>

    <div class="fg"><div class="flbl">Status</div>

}
function saveMaterial(projId){
  const name=val('mName'),qty=parseFloat(val('mQty'))||0,qtyUnit=val('mQtyUnit')||'pcs',spec=val('mSpec'),date=val('mDate'),status=val('mStatus');
  if(!name){alert('Material name is required.');return;}
  const m={id:Date.now(),projId:parseInt(projId),name,qty,qtyUnit,spec:spec||'—',date:date||today(),status,note:'',deliveries:[]};
  DB.materials.push(m);addLog(m,status);openCards[parseInt(projId)]=true;

// ── SCAN FEATURE ──────────────────────────────────────────────
let scanProjId=null;
function openScanModal(){scanProjId=null;_scanDrawer();}
function openScanForProject(id){scanProjId=id;_scanDrawer();}
function _scanDrawer(){
  const pOpts=DB.projects.length
    ?`<div class="fg"><div class="flbl">Add to Project</div><select class="finput" id="sProjSel">${DB.projects.map(p=>`<option value="${p.id}"${p.id===scanProjId?' selected':''}>${p.icon} ${p.name}</option>`).join('')}</select></div>`
    :'';
  openDrawer(`
    <div class="mtitle">📷 Scan Request Form</div>
    <div style="font-size:12px;color:var(--t2);margin-bottom:12px;line-height:1.6">Take a clear photo of your printed material request form. The app reads the text and pre-fills the details for you.</div>
    <div class="scan-zone" id="scanZone" onclick="document.getElementById('scanInput').click()">
      <div style="font-size:40px">📄</div>
      <div style="font-size:13px;color:var(--t2);text-align:center">Tap to take photo<br><span style="font-size:11px;color:var(--t3)">or choose from gallery</span></div>
    </div>
    <div id="ocrStatus"></div>
    <div id="ocrRaw"></div>
    ${pOpts}
    <div id="scanFields" style="display:none">
      <div style="font-size:13px;font-weight:700;color:var(--accent);margin-bottom:12px">✏️ Review Extracted Details</div>
      <div class="fg"><div class="flbl">Material Name</div><input class="finput" id="sfName" placeholder="Material name"></div>
      <div style="display:flex;gap:8px" class="fg">
        <div style="flex:1"><div class="flbl">Qty</div><input class="finput" id="sfQty" type="number" min="0" step="any" placeholder="0"></div>
        <div style="flex:1"><div class="flbl">Unit</div><select class="finput" id="sfUnit">${unitOpts('pcs')}</select></div>
      </div>
      <div class="fg"><div class="flbl">Specification</div><input class="finput" id="sfSpec" placeholder="Grade, type, size"></div>
      <div class="fg"><div class="flbl">Required By</div><input class="finput" id="sfDate" type="date" value="${today()}"></div>
      <button class="btn-ok" onclick="saveScan()">Add as Material Request</button>
    </div>
    <div style="margin-top:10px;text-align:center;font-size:11px;color:var(--t3)">💡 Best results: printed text, good lighting, flat paper</div>
  `);
}
function handleScanFile(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const src=ev.target.result;
    const z=document.getElementById('scanZone');
    if(z)z.innerHTML=`<img src="${src}" alt="preview">`;
    runOCR(src);
  };
  reader.readAsDataURL(file);
  e.target.value='';
}
function runOCR(src){
  const statusEl=document.getElementById('ocrStatus');
  if(!statusEl)return;
  statusEl.innerHTML=`<div class="ocr-progress">🔍 Reading text...<div class="ocr-bar"><div class="ocr-bar-fill" id="ocrFill" style="width:5%"></div></div></div>`;
  if(typeof Tesseract==='undefined'){
    statusEl.innerHTML=`<div class="ocr-progress" style="color:var(--warn)">⚠️ OCR needs internet on first load. Connect briefly and try again, then works offline.</div>`;
    showScanFields({});return;
  }
  Tesseract.recognize(src,'eng',{logger:m=>{const b=document.getElementById('ocrFill');if(b&&m.progress)b.style.width=Math.round(m.progress*100)+'%';}})
  .then(({data:{text}})=>{
    statusEl.innerHTML=`<div class="ocr-progress" style="color:var(--ok)">✓ Text extracted</div>`;
    const raw=document.getElementById('ocrRaw');
    if(raw)raw.innerHTML=`<div style="margin-bottom:10px"><div class="slbl">Extracted Text</div><div class="ocr-raw">${esc(text)}</div></div>`;
    showScanFields(parseOCR(text));
  })
  .catch(()=>{
    statusEl.innerHTML=`<div class="ocr-progress" style="color:var(--danger)">✗ Could not read image — please fill in manually.</div>`;
    showScanFields({});
  });
}
function parseOCR(text){
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  let name='',qty='',unit='pcs',spec='',date='';
  // Date
  const dm=text.match(/\b(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}|\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2})\b/);
  if(dm){const p=dm[1].split(/[\/\-]/);date=p[0].length===4?`${p[0]}-${p[1].padStart(2,'0')}-${p[2].padStart(2,'0')}`:`${p[2].length===2?'20'+p[2]:p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;}
  // Qty + unit
  const up=UNITS.join('|');
  const qm=text.match(new RegExp('(\\d+(?:\\.\\d+)?)\\s*('+up+')','i'));
  if(qm){qty=qm[1];unit=qm[2].toLowerCase();}
  else{const nm=text.match(/\b(\d{2,}(?:\.\d+)?)\b/);if(nm)qty=nm[1];}
  // Name — look for known material keywords
  const kw=['concrete','rebar','steel','pipe','block','tile','board','panel','membrane','frame','cable','wire','brick','plaster','cement','sand','gravel','paint','wood','timber','glass','door','window','pump','valve','duct'];
  let best='';
  for(const l of lines){const lo=l.toLowerCase();if(kw.some(k=>lo.includes(k))){best=l;break;}if(l.length>best.length&&l.length>5&&!/^\d/.test(l))best=l;}
  name=best.replace(/[^\w\s\-\.\/]/g,'').trim().slice(0,60);
  // Spec
  const sm=text.match(/(?:grade|type|class|size|spec)[:\s]*([A-Z0-9\/\- ]{2,20})/i)||text.match(/\b(\d{2,3}\s*(?:mm|cm|MPa))\b/i);
  if(sm)spec=sm[1].trim();
  return{name,qty,unit,spec,date:date||today()};
}
function showScanFields(pre){
  const f=document.getElementById('scanFields');if(!f)return;
  f.style.display='block';
  ['sfName','sfQty','sfSpec','sfDate'].forEach(id=>{
    const el=document.getElementById(id);
    const key={sfName:'name',sfQty:'qty',sfSpec:'spec',sfDate:'date'}[id];
    if(el&&pre[key])el.value=pre[key];
  });
  const u=document.getElementById('sfUnit');
  if(u&&pre.unit){const m=UNITS.find(x=>x.toLowerCase()===pre.unit.toLowerCase());if(m)u.value=m;}
}
function saveScan(){
  const pEl=document.getElementById('sProjSel');
  const projId=pEl?parseInt(pEl.value):scanProjId;
  if(!projId){alert('Select a project.');return;}
  const name=val('sfName'),qty=parseFloat(val('sfQty'))||0,qtyUnit=val('sfUnit')||'pcs',spec=val('sfSpec'),date=val('sfDate');
  if(!name){alert('Enter a material name.');return;}
  const m={id:Date.now(),projId,name,qty,qtyUnit,spec:spec||'—',date:date||today(),status:'requested',note:'Scanned from hard copy',deliveries:[]};
  DB.materials.push(m);addLog(m,'requested');openCards[projId]=true;
  save();closeDrawer();
  view='projects';
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on',i===0));
  document.querySelectorAll('.nb').forEach((b,i)=>b.classList.toggle('on',i===0));
  render();toast('Scanned material added ✓');
}

function openSettings(){
  openDrawer(`
    <div class="mtitle">Settings</div>
    <div class="card" style="padding:14px;margin-bottom:10px">
      <div style="font-size:13px;font-weight:700;margin-bottom:6px">📱 MaterialFlow v2.0</div>
      <div style="font-size:12px;color:var(--t2);line-height:1.8">All data stored locally on device.<br>No account or internet needed to use.</div>
    </div>
    <div class="card" style="padding:14px;margin-bottom:10px">
      <div style="font-size:13px;font-weight:700;margin-bottom:6px">📊 Summary</div>
      <div style="font-size:12px;color:var(--t2)">${DB.projects.length} projects · ${DB.materials.length} materials · ${DB.materials.reduce((s,m)=>s+m.deliveries.length,0)} delivery records</div>
    </div>
    <div class="card" style="padding:14px;margin-bottom:10px">
      <div style="font-size:13px;font-weight:700;margin-bottom:6px">📤 Export Backup</div>
      <div style="font-size:12px;color:var(--t2);margin-bottom:10px">Download all data as JSON file.</div>
      <button class="btn-ok" style="margin-top:0" onclick="exportData()">Export JSON</button>
    </div>
    <div class="card" style="padding:14px;margin-bottom:10px">
      <div style="font-size:13px;font-weight:700;margin-bottom:6px;color:var(--danger)">⚠️ Danger Zone</div>
      <button class="btn-ok btn-danger" style="margin-top:0" onclick="clearAll()">Clear All Data</button>
    </div>
  `);
}
function exportData(){
  const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(b);const a=document.createElement('a');
  a.href=u;a.download='materialflow-backup.json';a.click();URL.revokeObjectURL(u);
  toast('Exported!');
}
function clearAll(){
  if(!confirm('Delete ALL data? Cannot be undone.'))return;
  DB={projects:[],materials:[],log:[]};save();closeDrawer();render();toast('Cleared');
}
